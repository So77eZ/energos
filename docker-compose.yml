services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:8000
      # Читаются на сервере Next во время запроса — смена в .env не требует пересборки
      PUBLIC_URL: ${PUBLIC_URL}
      MAX_ENERGY_DRINK_IMAGE_SIZE: ${MAX_ENERGY_DRINK_IMAGE_SIZE}
    depends_on:
      - backend
    networks:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    env_file:
      - .env

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV}
      # Адрес сайта для Caddy: https://<домен> включает HTTPS
      PUBLIC_URL: ${PUBLIC_URL:?PUBLIC_URL не задан в .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      # Сертификаты Let's Encrypt: без томов перевыпускаются при каждом пересоздании контейнера
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - backend

networks:
  backend:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
