x-logging: &default-logging
  driver: splunk
  options:
    splunk-url: "http://127.0.0.1:9428"
    splunk-token: "any-token"
    splunk-format: "json"
    splunk-verify-connection: "false"
    labels: "com.docker.compose.service"


services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - ./data/postgres:/var/lib/postgresql
    ports:
      - "127.0.0.1:15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - database
    env_file:
      - .env
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      API_ORIGIN: http://backend:8000
      PUBLIC_URL: ${PUBLIC_URL}
    depends_on:
      - backend
    networks:
      - backend
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
      - database
    env_file:
      - .env
    logging: *default-logging
    
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      DEPLOY_ENV: ${DEPLOY_ENV}
      PUBLIC_URL: ${PUBLIC_URL}
      DOMAIN: ${DOMAIN}
      PUBLIC_IP: ${PUBLIC_IP}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./server/Caddyfile.${DEPLOY_ENV}:/etc/caddy/Caddyfile
      - ./docker-data/caddy/data:/data
      - ./docker-data/caddy/config:/config
    depends_on:
      - frontend
      - backend
    networks:
      - backend
      - logs
    logging: *default-logging

  mailserver:
    image: ghcr.io/docker-mailserver/docker-mailserver:latest
    container_name: mailserver
    hostname: mail.energos.fun
    restart: unless-stopped
    ports:
      - "25:25"      # SMTP (server-to-server mail delivery)
      - "465:465"    # SMTPS (client mail submission, implicit TLS)
      - "587:587"    # Submission (client mail submission, STARTTLS)
      - "993:993"    # IMAPS (client mail retrieval)
    volumes:
      - ./docker-data/dms/mail-data/:/var/mail/
      - ./docker-data/dms/mail-state/:/var/mail-state/
      - ./docker-data/dms/mail-logs/:/var/log/mail/
      - ./docker-data/dms/config/:/tmp/docker-mailserver/
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - SSL_TYPE=letsencrypt
      - ENABLE_RSPAMD=1
      - ENABLE_CLAMAV=1
      - ENABLE_FAIL2BAN=1
    cap_add:
      - NET_ADMIN
    networks:
      - backend
    logging: *default-logging

  victoria-logs:
    image: docker.io/victoriametrics/victoria-logs:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:9428:9428"
    command:
      - "--storageDataPath=/victoria-logs-data"
      - "--splunk.msgField=event.line.msg,event.line.message,event.line"
      - "--splunk.streamFields=event.attrs.com.docker.compose.service"
    volumes:
      - ./docker-data/victoria-logs/data:/victoria-logs-data
    networks:
      - logs

  vmauth:
    image: victoriametrics/vmauth:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8427:8427"
    volumes:
      - ./vmauth.yml:/etc/vmauth.yml:ro
    command:
      - "-auth.config=/etc/vmauth.yml"
      - "-httpListenAddr=:8427"
    environment:
      - VMAUTH_USERNAME=${VMAUTH_USERNAME}
      - VMAUTH_PASSWORD=${VMAUTH_PASSWORD}
    depends_on:
      - victoria-logs
    networks:
      - logs

networks:
  backend:
    driver: bridge
  database:
    driver: bridge
  logs:
    driver: bridge
