[project]
name = "energy-drink-rating"
version = "0.1.0"
description = "This project is a concept website for reviewing and ranking energy drinks"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aioboto3>=15.5.0",
    "aiosmtplib>=5.1.3",
    "alembic>=1.20.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.142.0",
    "fastapi-limitex>=1.1.1",
    "fastapi-users[sqlalchemy]>=15.0.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.10",
    "sqlalchemy>=2.0.54",
    "ty>=0.0.84",
    "uvicorn>=0.54.0",
]

[tool.ruff]
line-length = 120

exclude = [
    "alembic/versions/*",
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "ANN"]

[tool.ruff.lint.flake8-annotations]
suppress-dummy-args = true
mypy-init-return = true
